[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asynctaskflow-api"
version = "0.1.0"
description = "FastAPI service for AsyncTaskFlow"
authors = [
    {name = "Bob Alexander", email = "gogonegro@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ─────────────────────────────────────────────────── #
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",

    # ── Data / messaging ──────────────────────────────────────────────── #
    "redis>=5.0.0",
    "celery[redis]>=5.4",
    "httpx>=0.27",             # used by embedder, ingester URL fetch, notify

    # ── ForgeChain packages deps ──────────────────────────────────────── #
    # These are imported transitively via /packages at runtime.
    "chromadb>=0.5",           # KnowledgeStore (vector DB)
    "dspy-ai>=2.5",            # DSPy modules + BootstrapFewShot
    "anthropic>=0.40",         # Anthropic LLM provider
    "google-generativeai>=0.8",# Gemini LLM provider
    "openai>=1.50",            # Grok + Ollama adapters (OpenAI-compat API)
    "PyGithub>=2.3",           # GitHub PR creation
    "cryptography>=42.0",      # PIIVault Fernet encryption
    "asyncpg>=0.29",           # Postgres async writes (token ledger, examples)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.7.0",
]

# Add this section to tell hatchling which files to include
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
